<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Jumpscare Polos
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   /* Fullscreen overlay for jumpscare */
    #jumpscareOverlay {
      transition: opacity 0.3s ease;
    }
  </style>
 </head>
 <body class="bg-black flex items-center justify-center min-h-screen overflow-hidden">
  <button class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg text-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-red-500" id="startButton">
   Mulai Jumpscare
  </button>
  <div class="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center opacity-0 pointer-events-none z-50" id="jumpscareOverlay">
   <img alt="Close-up of a terrifying distorted horror face with wide eyes and open mouth screaming, dark shadows and eerie lighting" class="max-w-full max-h-full" draggable="false" height="600" id="jumpscareImage" src="https://storage.googleapis.com/a1aa/image/a596af13-04a6-4c39-afb0-81416011ecc3.jpg" width="600"/>
  </div>
  <audio id="jumpscareSound" preload="auto" src="https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg">
  </audio>
  <script>
   const startButton = document.getElementById("startButton");
    const jumpscareOverlay = document.getElementById("jumpscareOverlay");
    const jumpscareSound = document.getElementById("jumpscareSound");

    function playJumpscare() {
      jumpscareOverlay.classList.remove("opacity-0", "pointer-events-none");
      jumpscareSound.volume = 1.0;
      jumpscareSound.currentTime = 0;
      jumpscareSound.play();

      // After 2.5 seconds hide the jumpscare
      setTimeout(() => {
        jumpscareOverlay.classList.add("opacity-0", "pointer-events-none");
      }, 2500);
    }

    startButton.addEventListener("click", () => {
      // Disable button to prevent multiple clicks
      startButton.disabled = true;
      startButton.classList.add("opacity-50", "cursor-not-allowed");

      // Wait random time between 3 to 8 seconds before jumpscare
      const delay = Math.floor(Math.random() * 5000) + 3000;
      setTimeout(() => {
        playJumpscare();

        // Re-enable button after jumpscare ends
        setTimeout(() => {
          startButton.disabled = false;
          startButton.classList.remove("opacity-50", "cursor-not-allowed");
        }, 3000);
      }, delay);
    });
  </script>
 </body>
</html>
